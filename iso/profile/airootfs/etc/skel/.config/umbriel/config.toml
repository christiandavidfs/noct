# Noga Linux — configuración por defecto de Umbriel (Rakia).
# Referencia: https://docs.noctalia.dev/umbriel/
# Los cambios se aplican al guardar; valida con: umbriel config validate

# Incluye los fragmentos gestionados por Noct/Noctalia (teclado, efectos, tema).
[include]
files = []

[include.optional]
files = ["noct/effects.toml", "noctalia.toml"]

[events]
lid_close = "rakia-lid close"
lid_open = "rakia-lid open"

[general]
autostart = ["noctalia"]
show_cheatsheet = false
xwayland_native_resolution = true
focus_on_activate = true

[appearance.blur]
radius = 3

# Paleta oscura de Rakia. Noctalia pinta sus paneles; Umbriel usa estos
# colores para bordes, título, overview y barras de pestañas.
[colors]
background = "#05060AFF"
text_primary = "#E8F6ECFF"
text_muted = "#8B95A7FF"
accent_primary = "#7CFFB2FF"
accent_secondary = "#BFEFD4FF"
warning = "#E2C08DFF"
error = "#FFB4ABFF"
insert_hint = "#7CFFB2FF"
backdrop = "#000000FF"

[colors.border]
focused = "#7CFFB2FF"
unfocused = "#25324AFF"
outer = "#000000FF"

[colors.overview]
background_tint = "#00000088"
badge = "#7CFFB2FF"
workspace_background = "#000000FF"

[input.keyboard]
layout = "es"
numlock_toggle = true

[input.touchpad]
tap = true
natural_scroll = true
disable_while_typing = false

[input.mouse]
natural_scroll = false

[input.focus]
follows_mouse = "sloppy"

[layout]
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5

[keybinds]

"Alt+Print" = "spawn noct msg screenshot-annotate"
"Ctrl+Alt+Delete" = "session-quit"
"Ctrl+Print" = "spawn noct msg screenshot-fullscreen"
"Mod+Alt+L" = "spawn noct msg session lock"
"Mod+B" = "spawn brave"
"Mod+BracketLeft" = "window-consume-or-expel-left"
