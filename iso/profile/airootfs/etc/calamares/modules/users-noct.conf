# Nocturne Linux — usuario del sistema instalado.
---
defaultGroups:
    - wheel
    - rfkill
    - users
    - lp
    - video
    - network
    - storage
    - audio
    - render
    - input
    - power

doAutologin:     false
sudoersGroup:    wheel
setRootPassword: true
doReusePassword: true

passwordRequirements:
    minLength: 4

allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    forbidden_names:
        - root
        - nocturne
        - adm
        - bin
        - daemon
        - dbus
        - ftp
        - games
        - http
        - lp
        - mail
        - nobody
        - polkitd
        - systemd-network
        - systemd-resolve
        - systemd-timesync
        - uucp
        - uuidd
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "nocturne"
    forbidden_names: [ localhost ]
