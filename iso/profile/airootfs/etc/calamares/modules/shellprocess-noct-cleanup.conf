# Noga Linux — limpia los restos del live y prepara el primer arranque.
---
dontChroot: false
timeout: 300
script:
    - command: "rm -f /etc/sudoers.d/10-noga-live"
    - command: "rm -rf /home/noga"
    - command: "groupdel noga 2>/dev/null || true"
    - command: "rm -f /etc/systemd/system/pacman-init.service /etc/systemd/system/etc-pacman.d-gnupg.mount /etc/systemd/system/multi-user.target.wants/pacman-init.service"
    - command: "rm -f /etc/systemd/system/ananicy-cpp.service /etc/systemd/system/getty@tty1.service"
    - command: "rm -rf /etc/calamares /usr/share/calamares /usr/local/bin/noga-install /usr/share/applications/noga-install.desktop /usr/share/applications/calamares.desktop"
    - command: "/usr/local/bin/noga-greetd"
    - command: "pacman-key --init"
    - command: "pacman-key --populate archlinux cachyos"
    - command: "printf 'Noga Linux\\nun escritorio hecho de noche\\n' > /etc/motd"
