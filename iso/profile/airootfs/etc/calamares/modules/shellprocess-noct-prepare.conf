# Noga Linux — prepara el sistema instalado antes de mkinitcpio.
---
dontChroot: true
timeout: 180
script:
    - command: "/usr/local/bin/noga-vmlinuz ${ROOT}"
    - command: "rm -f ${ROOT}/etc/mkinitcpio.conf.d/archiso.conf"
    - command: "rm -f ${ROOT}/etc/systemd/system/pacman-init.service ${ROOT}/etc/systemd/system/etc-pacman.d-gnupg.mount ${ROOT}/etc/systemd/system/multi-user.target.wants/pacman-init.service"
    - command: "rm -f ${ROOT}/etc/systemd/system/ananicy-cpp.service"
    - command: "rm -f ${ROOT}/etc/sudoers.d/10-noga-live"
    - command: "rm -rf ${ROOT}/home/noga"
