# Nocturne Linux — instalador offline basado en Calamares.
---
modules-search: [ local ]

instances:
  - id: noct
    module: welcome
    config: welcome-noct.conf
  - id: noct
    module: partition
    config: partition-noct.conf
  - id: noct
    module: users
    config: users-noct.conf
  - id: noct
    module: unpackfs
    config: unpackfs-noct.conf
  - id: noct
    module: initcpiocfg
    config: initcpiocfg-noct.conf
  - id: noct
    module: initcpio
    config: initcpio-noct.conf
  - id: noct
    module: removeuser
    config: removeuser-noct.conf
  - id: noct
    module: bootloader
    config: bootloader-noct.conf
  - id: noct
    module: services-systemd
    config: services-systemd-noct.conf
  - id: prepare
    module: shellprocess
    config: shellprocess-noct-prepare.conf
  - id: cleanup
    module: shellprocess
    config: shellprocess-noct-cleanup.conf

sequence:
  - show:
      - welcome@noct
      - locale
      - keyboard
      - partition@noct
      - users@noct
      - summary
  - exec:
      - partition@noct
      - mount
      - unpackfs@noct
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - shellprocess@prepare
      - initcpiocfg@noct
      - initcpio@noct
      - removeuser@noct
      - users@noct
      - networkcfg
      - shellprocess@cleanup
      - bootloader@noct
      - services-systemd@noct
      - umount
  - show:
      - finished

branding: nocturne
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
