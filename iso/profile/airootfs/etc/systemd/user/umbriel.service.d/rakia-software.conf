# Rakia: permite el renderizado software de Umbriel.
#
# Umbriel (wlroots) se niega a arrancar cuando la GPU no ofrece EGL/GL por
# hardware: máquinas virtuales sin aceleración 3D (VMware, QEMU con VGA
# básica), equipos con drivers incompletos o arranques de emergencia. Sin
# esto, la sesión live se queda en negro y greetd falla.
#
# Solo *permite* el software: en un equipo con GPU real sigue usando la GPU.
[Service]
Environment=WLR_RENDERER_ALLOW_SOFTWARE=1
