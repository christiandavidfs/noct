#
# pacman.conf used by mkarchiso to build the Nocturne live root.
# Pins working mirrors so the build does not stall on dead hosts.
# The installed/live system uses cachyos-mirrorlist instead.
#

[options]
HoldPkg     = pacman glibc
Architecture = x86_64
Color
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[cachyos]
Server = https://cdn77.cachyos.org/repo/$arch/cachyos
Server = https://at.cachyos.org/repo/$arch/cachyos
Server = https://mirror.zyner.org/cachyos/repo/$arch/cachyos

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
