LABEL existing
TEXT HELP
Arranca un sistema operativo ya instalado.
Pulsa TAB para editar el disco y la particion.
ENDTEXT
MENU LABEL Arrancar sistema existente
COM32 chain.c32
APPEND hd0 0

LABEL reboot
TEXT HELP
Reinicia el equipo.
ENDTEXT
MENU LABEL ^Reiniciar
COM32 reboot.c32

LABEL poweroff
TEXT HELP
Apaga el equipo.
ENDTEXT
MENU LABEL ^Apagar
COM32 poweroff.c32
