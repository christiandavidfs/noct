LABEL nocturne
TEXT HELP
Arranca Nocturne Linux en modo live.
Instala el sistema o pruebalo sin tocar el disco.
ENDTEXT
MENU LABEL ^Nocturne Linux (BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL nocturne-safe
TEXT HELP
Arranca sin KMS. Util si la pantalla se queda negra.
ENDTEXT
MENU LABEL Nocturne Linux (^modo seguro)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
