name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Shell syntax
        run: |
          for script in install.sh iso/build.sh \
            iso/profile/airootfs/usr/local/bin/* \
            iso/profile/airootfs/root/customize_airootfs.sh; do
            bash -n "$script"
          done
      - name: Shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error install.sh iso/build.sh \
            iso/profile/airootfs/usr/local/bin/* \
            iso/profile/airootfs/root/customize_airootfs.sh
